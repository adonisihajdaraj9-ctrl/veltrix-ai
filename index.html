<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VELTRIX AI | Intelligence & Automation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #ffffff; }
    </style>
</head>
<body class="antialiased">
    <div class="min-h-screen flex flex-col items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl text-center">
            <h1 class="text-3xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">VELTRIX AI</h1>
            <p class="text-slate-400 mb-6 text-sm">Automatiszo biznesin tënd dhe fito klientë 24/7. Regjistrohu për provën falas!</p>
            
            <form id="leadForm" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Emri i Biznesit / Juaj</label>
                    <input type="text" id="name" required class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="Shkruani emrin...">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Email-i</label>
                    <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg bg-slate-800 border border-slate-700 text-white focus:outline-none focus:border-blue-500 text-sm" placeholder="adresa@gmail.com">
                </div>
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-200 text-sm">Fillo Provën Falas</button>
            </form>
            <p id="successMsg" class="hidden mt-4 text-green-400 text-sm font-medium">U regjistruat me sukses! Të dhënat u dërguan te Make.</p>
        </div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                // Zëvendëso fjalën KETU_VENDOS_LINKUN_E_MAKE me linkun e saktë që morite nga Make
                await fetch('KETU_VENDOS_LINKUN_E_MAKE', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: name, email: email })
                });
                document.getElementById('leadForm').reset();
                document.getElementById('successMsg').classList.remove('hidden');
            } catch (err) {
                alert('Pati një gabim, provoni përsëri.');
            }
        });
    </script>
</body>
</html>
